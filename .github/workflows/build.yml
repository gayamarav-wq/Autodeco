name: Build Auto Decorator

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Android32, os: ubuntu-latest, target: Android32 }
          - { name: Android64, os: ubuntu-latest, target: Android64 }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the uploaded source zip
        shell: bash
        run: |
          unzip -oq ./*.zip
          cp -r auto-decorator/. .
          ls -a
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.10.1
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Combine into one .geode
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combined
      - uses: actions/upload-artifact@v4
        with:
          name: Auto Decorator (Android)
          path: ${{ steps.combined.outputs.build-output }}
